# =============================================================================
# Configurazione Comune Hardware Reale (GuarDrone + GCS + Interaction Drone)
# =============================================================================

# Parametri Camera (Intel RealSense D435)
camera:
  cam_x: 0.105        # Offset X dal CoM [m]
  cam_y: 0.0          # Offset Y dal CoM [m]
  cam_z: -0.15        # Offset Z dal CoM [m]
  cam_roll: 0.0       # Rotazione roll [rad]
  cam_pitch: 0.0      # Rotazione pitch [rad]
  cam_yaw: 0.0        # Rotazione yaw [rad]
  fov_h_deg: 85.2     # FOV orizzontale [deg]
  fov_v_deg: 58.0     # FOV verticale [deg]

# Parametri End-Effector / Peg
peg:
  peg_z_offset: 0.22  # Offset Z della punta dell'end-effector dal CoM del drone di interazione [m]

  # Spostamento relativo del peg durante APPROACH [m] (rispetto alla posa di hovering)
  approach:
    delta_x: 1.0
    delta_y: -1.80
    delta_z: 0.0

  # Spostamento relativo del peg durante DETACHMENT [m] (rispetto alla posa di contatto)
  detachment:
    delta_x: 0.0
    delta_y: -0.5
    delta_z: 0.0

# Quote di decollo ENU [m]
mission:
  takeoff_alt_guardrone: 1.50   # Quota di decollo per GuarDrone (camera a 1.50 m)
  takeoff_alt_peg: 1.50         # Quota di decollo per Interaction Drone (punta peg a 1.50 m)

# Pose Iniziali (per MOCAP / OptiTrack su hardware: 0.0 poiché il frame è già globale)
initial_poses:
  drone_x: 0.0
  drone_y: 0.0
  drone_z: 0.0
  drone_yaw: 0.0
  peg_x: 0.0
  peg_y: 0.0
  peg_z: 0.0
  peg_yaw: -1.57

# Parametri Fisici GuarDrone Reale
guardrone_physics:
  mass: 3.4
  ixx: 0.0232
  iyy: 0.0224
  izz: 0.0405
  f_max: 52.0
  w_min: 150.0
  w_max: 1200.0
  arm_l_x: 0.151
  arm_l_y: 0.160
  moment_const: 0.0144
  cf: 1.25e-5
  ct: 1.8e-7
  controller: 1

# Topics e Logging
topics:
  peg_ft_topic: '/interaction_drone/force_torque'
  log_save_path: '/tmp/hw_run.mat'
  record_rosbag: true                           # Registra automaticamente rosbag con TF, camera e pose in RViz
  camera_topic: '/camera/camera/color/image_raw/compressed' # Topic immagine compressa RealSense

